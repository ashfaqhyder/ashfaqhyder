
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="400"
     viewBox="0 0 1200 400">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="55%" stop-color="#151515"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none"
            stroke="#ffffff" stroke-opacity=".055" stroke-width=".6"/>
    </pattern>

    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#ffffff" opacity=".18"/>
    </pattern>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>

    <clipPath id="logoClip">
      <circle cx="970" cy="200" r="88"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#dots)" opacity=".25"/>

  <!-- Decorative framing -->
  <path d="M48 42H1152 M48 358H1152"
        stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/>

  <text x="50" y="30" fill="#888888"
        font-family="monospace" font-size="10"
        letter-spacing="3">PERSONAL PORTFOLIO / 2026</text>

  <text x="1150" y="30" text-anchor="end"
        fill="#888888" font-family="monospace"
        font-size="10" letter-spacing="2">01 — 03</text>

  <!-- Main typography -->
  <text x="54" y="155"
        fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="76" font-weight="800"
        letter-spacing="-4">ASHFAQ</text>

  <text x="54" y="232"
        fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="76" font-weight="800"
        letter-spacing="-4">HYDER.</text>

  <rect x="56" y="260" width="390" height="1.5" fill="url(#line)"/>

  <text x="56" y="292"
        fill="#c9c9c9"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15" letter-spacing="3">
    CODE × DESIGN × INTELLIGENCE
  </text>

  <text x="56" y="326"
        fill="#777777"
        font-family="monospace"
        font-size="11" letter-spacing="1.5">
    AI SYSTEMS  /  CYBERSECURITY  /  SOFTWARE ENGINEERING
  </text>

  <!-- Logo frame -->
  <circle cx="970" cy="200" r="112"
          fill="none" stroke="#ffffff"
          stroke-opacity=".25" stroke-width="1"/>

  <circle cx="970" cy="200" r="100"
          fill="none" stroke="#ffffff"
          stroke-opacity=".12" stroke-width="1"
          stroke-dasharray="3 7"/>

  <circle cx="970" cy="200" r="88"
          fill="#ffffff" fill-opacity=".04"
          stroke="#ffffff" stroke-opacity=".5"
          stroke-width="1.5"/>

  <!-- Portfolio logo -->
  <image
    x="882" y="112"
    width="176" height="176"
    xlink:href="assets/ashfaq-hyder-logo.png"
    preserveAspectRatio="xMidYMid meet"
    clip-path="url(#logoClip)"/>

  <!-- Small accents -->
  <circle cx="970" cy="80" r="3" fill="#ffffff"/>
  <circle cx="1090" cy="200" r="3" fill="#ffffff"/>
  <circle cx="970" cy="320" r="3" fill="#ffffff"/>
  <circle cx="850" cy="200" r="3" fill="#ffffff"/>

  <!-- Footer -->
  <text x="56" y="382"
        fill="#666666"
        font-family="monospace"
        font-size="9" letter-spacing="1.5">
    BENGALURU, INDIA
  </text>

  <text x="1145" y="382" text-anchor="end"
        fill="#888888"
        font-family="monospace"
        font-size="9" letter-spacing="1.5">
    ASHFAQHYDERCS.VERCEL.APP
  </text>

</svg>
