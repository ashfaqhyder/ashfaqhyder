
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400">

<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050505"/>
    <stop offset=".5" stop-color="#151515"/>
    <stop offset="1" stop-color="#030303"/>
  </linearGradient>

  <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".5" stop-color="#999999"/>
    <stop offset="1" stop-color="#eeeeee"/>
  </linearGradient>

  <pattern id="grid" width="25" height="25"
           patternUnits="userSpaceOnUse">
    <path d="M25 0H0V25" fill="none"
          stroke="#ffffff" stroke-opacity=".055"/>
  </pattern>

  <pattern id="dots" width="7" height="7"
           patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#fff" opacity=".3"/>
  </pattern>

  <clipPath id="rightClip">
    <rect x="830" y="35" width="320" height="320"/>
  </clipPath>
</defs>

<!-- BACKGROUND -->
<rect width="1200" height="400" fill="url(#background)"/>
<rect width="1200" height="400" fill="url(#grid)"/>

<!-- LEFT EDITORIAL COLUMN -->
<text x="65" y="55" fill="#999"
      font-family="monospace" font-size="12"
      letter-spacing="4">
  INDEPENDENT DEVELOPER / 2026
</text>

<path d="M65 75H1135" stroke="#777" stroke-opacity=".5"/>

<!-- OVERSIZED TYPOGRAPHY -->
<text x="55" y="205"
      font-family="Arial,sans-serif"
      font-size="104" font-weight="900"
      letter-spacing="-7" fill="url(#silver)">
  ASHFAQ
</text>

<text x="55" y="302"
      font-family="Arial,sans-serif"
      font-size="104" font-weight="900"
      letter-spacing="-7" fill="#ffffff">
  HYDER
</text>

<!-- UNDERLINE -->
<rect x="65" y="325" width="95" height="3" fill="#fff"/>

<text x="65" y="355"
      font-family="monospace" font-size="14"
      letter-spacing="3" fill="#aaa">
  CODE × DESIGN × INTELLIGENCE
</text>

<!-- Your personal logo -->
<circle cx="970" cy="200" r="112"
        fill="#ffffff" fill-opacity="0.04"
        stroke="#ffffff" stroke-opacity="0.45"
        stroke-width="1.5"/>

<defs>
  <clipPath id="logoClip">
    <circle cx="970" cy="200" r="88"/>
  </clipPath>
</defs>

<image
  href="https://ashfaqhydercs.vercel.app/ashfaq-hyder-logo.png"
  x="882" y="112"
  width="176" height="176"
  preserveAspectRatio="xMidYMid meet"
  clip-path="url(#logoClip)"
/>

<!-- RIGHT LABELS -->
<text x="830" y="375"
      font-family="monospace" font-size="11"
      fill="#999" letter-spacing="3">
  PERSONAL SIGNATURE / 001
</text>

<!-- FOOTER -->
<path d="M65 380H1135" stroke="#555"/>

<text x="65" y="394"
      font-family="monospace" font-size="9"
      fill="#777" letter-spacing="2">
  AI SYSTEMS / CYBERSECURITY / SOFTWARE ENGINEERING
</text>

<text x="1135" y="394"
      font-family="monospace" font-size="9"
      text-anchor="end" fill="#777">
  ASHFAQHYDERCS.VERCEL.APP
</text>

</svg>
