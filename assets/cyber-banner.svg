
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="bg" x2="1" y2="1">
    <stop stop-color="#000000"/>
    <stop offset=".55" stop-color="#191919"/>
    <stop offset="1" stop-color="#050505"/>
  </linearGradient>
  <linearGradient id="glass" x2="1" y2="1">
    <stop stop-color="#ffffff" stop-opacity=".15"/>
    <stop offset=".5" stop-color="#ffffff" stop-opacity=".025"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity=".09"/>
  </linearGradient>
  <linearGradient id="silver" x2="0" y2="1">
    <stop stop-color="#ffffff"/>
    <stop offset="1" stop-color="#888888"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".055"/>
  </pattern>
  <filter id="blur">
    <feGaussianBlur stdDeviation="28"/>
  </filter>
</defs>

<rect width="1200" height="360" fill="url(#bg)"/>
<rect width="1200" height="360" fill="url(#grid)"/>

<circle cx="980" cy="60" r="170" fill="#fff" opacity=".09" filter="url(#blur)"/>
<circle cx="100" cy="330" r="150" fill="#aaa" opacity=".08" filter="url(#blur)"/>

<rect x="25" y="25" width="1150" height="310" rx="25"
      fill="url(#glass)" stroke="#fff" stroke-opacity=".35"/>

<path d="M25 90H1175" stroke="#fff" stroke-opacity=".12"/>
<path d="M25 300H1175" stroke="#fff" stroke-opacity=".12"/>

<text x="75" y="75" fill="#aaa" font-size="14"
      font-family="monospace" letter-spacing="5">
  PERSONAL DEVELOPER PROFILE / 001
</text>

<text x="72" y="170" fill="url(#silver)" font-size="65"
      font-family="Arial,sans-serif" font-weight="bold">
  ASHFAQ HYDER
</text>

<text x="77" y="213" fill="#ddd" font-size="19"
      font-family="Arial,sans-serif" letter-spacing="4">
  CODE × DESIGN × INTELLIGENCE
</text>

<text x="77" y="255" fill="#999" font-size="14"
      font-family="monospace" letter-spacing="2">
  AI SYSTEMS / CYBERSECURITY / SOFTWARE ENGINEERING
</text>

<rect x="930" y="95" width="170" height="170" rx="22"
      fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".4"/>

<circle cx="1015" cy="180" r="59" fill="none"
        stroke="#fff" stroke-opacity=".4"/>
<circle cx="1015" cy="180" r="46" fill="none"
        stroke="#fff" stroke-opacity=".2" stroke-dasharray="3 7"/>

<text x="1015" y="193" text-anchor="middle"
      fill="#fff" font-size="40" font-weight="bold"
      font-family="Arial,sans-serif">AH</text>

<text x="77" y="318" fill="#777" font-size="11"
      font-family="monospace" letter-spacing="3">
  BUILD. BREAK. LEARN. INNOVATE.
</text>
</svg>
